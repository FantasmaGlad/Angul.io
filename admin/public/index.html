<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Angul.io — Admin</title>
    <style>
      /* Même langage visuel "labo premium" que le client joueur (glassmorphism clair, fixe,
         non adaptatif au thème système — cohérence entre les deux apps), mais servi comme une
         app entièrement séparée (Lot 5.4 : "séparée du client joueur"). */
      :root {
        --bg-0: #eeeef0;
        --bg-1: #e2e2e6;
        --ink: #111113;
        --ink-soft: #6b6b70;
        --hairline: rgba(17, 17, 19, 0.09);
        --glass: rgba(255, 255, 255, 0.55);
        --glass-strong: rgba(255, 255, 255, 0.78);
        --glass-border: rgba(255, 255, 255, 0.65);
        --shadow: 0 20px 60px rgba(17, 17, 19, 0.16), 0 2px 8px rgba(17, 17, 19, 0.06);
        --accent: #111113;
        --accent-ink: #f5f5f6;
        --danger: #e0665c;
        --success: #2f9e63;
        --surface-1: rgba(255, 255, 255, 0.45);
        --surface-2: rgba(255, 255, 255, 0.85);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        color: var(--ink);
        background-color: var(--bg-1);
        background-image:
          radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.9), transparent 45%),
          radial-gradient(circle at 85% 90%, rgba(255, 255, 255, 0.6), transparent 40%),
          linear-gradient(160deg, var(--bg-0), var(--bg-1));
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .panel {
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        padding: 22px 26px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
      }
      input {
        box-sizing: border-box;
        font-size: 14px;
        font-family: inherit;
        color: var(--ink);
        background: var(--surface-1);
        border: 1px solid var(--hairline);
        border-radius: 12px;
        padding: 9px 12px;
      }
      input:focus {
        outline: none;
        background: var(--surface-2);
        border-color: var(--ink);
      }
      button {
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border-radius: 12px;
        border: 1px solid transparent;
        padding: 9px 16px;
      }
      button:active {
        transform: translateY(1px);
      }
      .btn-primary {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .btn-ghost {
        background: var(--surface-1);
        color: var(--ink);
        border-color: var(--hairline);
      }
      .btn-ghost:hover {
        background: var(--surface-2);
      }
      .error {
        min-height: 1.2em;
        margin: 8px 0 0;
        font-size: 12.5px;
        color: var(--danger);
      }
      .status {
        min-height: 1.2em;
        margin: 8px 0 0;
        font-size: 12.5px;
        color: var(--success);
      }

      #loginOverlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      #loginOverlay .panel {
        width: 320px;
      }
      #loginPasswordInput {
        width: 100%;
        margin: 14px 0 0;
      }
      #loginButton {
        width: 100%;
        margin-top: 14px;
      }

      #adminPanel {
        display: none;
        max-width: 900px;
        margin: 32px auto;
        padding: 0 20px;
        flex-direction: column;
        gap: 18px;
      }
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .search-row {
        display: flex;
        gap: 8px;
      }
      #searchInput {
        flex: 1;
      }
      #resultsList,
      #detailBestScores {
        list-style: none;
        margin: 14px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 260px;
        overflow-y: auto;
      }
      #resultsList li,
      #detailBestScores li {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        background: var(--surface-1);
        border: 1px solid var(--hairline);
        border-radius: 12px;
      }
      .result-item {
        cursor: pointer;
      }
      .result-item:hover {
        background: var(--surface-2);
      }
      .badge {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      #detailPanel {
        display: none;
      }
      .field-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 14px;
      }
      .field-grid label,
      .checkbox-row label {
        display: block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin-bottom: 6px;
      }
      .field-grid input {
        width: 100%;
      }
      .checkbox-row {
        display: flex;
        gap: 24px;
        margin-top: 14px;
      }
      .checkbox-row > div {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .checkbox-row label {
        margin: 0;
      }
      .checkbox-row input {
        width: auto;
      }
      #detailCosmeticsInput {
        width: 100%;
        margin-top: 6px;
        box-sizing: border-box;
      }
      .section-title {
        display: block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin: 18px 0 0;
      }
      #saveButton {
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <div id="loginOverlay">
      <div class="panel">
        <h1>Angul.io — Admin</h1>
        <p style="color: var(--ink-soft); font-size: 12.5px; margin: 4px 0 0">
          Accès réservé (cahier des charges §5.4)
        </p>
        <input id="loginPasswordInput" type="password" placeholder="Mot de passe admin" />
        <button id="loginButton" class="btn-primary" type="button">Se connecter</button>
        <p id="loginError" class="error"></p>
      </div>
    </div>

    <div id="adminPanel">
      <div class="top-bar">
        <h1>Angul.io — Admin</h1>
        <button id="logoutButton" class="btn-ghost" type="button">Déconnexion</button>
      </div>

      <section class="panel">
        <span class="section-title">Comptes joueurs</span>
        <div class="search-row" style="margin-top: 10px">
          <input id="searchInput" placeholder="Rechercher un pseudo…" />
          <button id="searchButton" class="btn-ghost" type="button">Rechercher</button>
        </div>
        <ul id="resultsList"></ul>
      </section>

      <section class="panel" id="detailPanel">
        <h2 id="detailPseudo" style="margin: 0; font-size: 16px"></h2>

        <div class="field-grid">
          <div>
            <label for="detailLevelInput">Niveau</label>
            <input id="detailLevelInput" type="number" min="1" step="1" />
          </div>
          <div>
            <label for="detailXpInput">XP</label>
            <input id="detailXpInput" type="number" min="0" step="1" />
          </div>
        </div>

        <div class="checkbox-row">
          <div>
            <input id="detailPremiumCheckbox" type="checkbox" />
            <label for="detailPremiumCheckbox">Premium</label>
          </div>
          <div>
            <input id="detailBannedCheckbox" type="checkbox" />
            <label for="detailBannedCheckbox">Banni</label>
          </div>
        </div>

        <span class="section-title">Cosmétiques (séparés par des virgules)</span>
        <input id="detailCosmeticsInput" placeholder="ex. chapeau, aura_or" />

        <span class="section-title">Meilleurs scores</span>
        <ul id="detailBestScores"></ul>

        <button id="saveButton" class="btn-primary" type="button">Enregistrer</button>
        <p id="detailError" class="error"></p>
        <p id="detailStatus" class="status"></p>
      </section>
    </div>

    <!-- Chemin absolu, pas relatif : `/admin` (sans slash final) résoudrait `./bundle.js` vers
         `/bundle.js` (le bundle du client joueur, pas celui-ci) — voir net/server.ts, la route
         `/admin` sans slash sert quand même ce fichier, sans redirection vers `/admin/`. -->
    <script type="module" src="/admin/bundle.js"></script>
  </body>
</html>
