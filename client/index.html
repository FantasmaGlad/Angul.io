<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Angul.io</title>
    <!-- Lot 7.1 (PWA) : manifeste + icônes — permet au navigateur de proposer l'installation
         ("Ajouter à l'écran d'accueil"). `apple-touch-icon` couvre le comportement d'ajout à
         l'écran d'accueil sur iOS Safari (pas de manifeste PWA standard côté iOS), mais la
         validation complète du support iOS reste différée (voir plan_implementation.md 7.5). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-512.png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
