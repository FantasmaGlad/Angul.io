name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # PostgreSQL réel (Lot 3+) — les tests contre une vraie base (accountsRepository, service,
    # net/server "avec comptes joueurs", etc.) utilisent `describe.skipIf(!DATABASE_URL)` :
    # sans ce service, ils étaient jusqu'ici silencieusement ignorés en CI (gap noté depuis la
    # clôture du Lot 3, jamais traité). `DATABASE_URL` en variable d'environnement du job
    # (sans fichier `server/.env`) suffit à `node-pg-migrate`/vitest, qui lisent tous deux
    # directement `process.env.DATABASE_URL` — vérifié manuellement en local avant d'ajouter ce
    # service (voir Journal des décisions, plan_implementation.md).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: angulio
          POSTGRES_PASSWORD: angulio
          POSTGRES_DB: angulio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://angulio:angulio@localhost:5432/angulio_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run migrate:up --workspace=server
      - run: npm test
      - run: npm run build
